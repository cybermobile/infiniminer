name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build src/Infiniminer.sln -c Release
      - name: Test
        run: dotnet test src/Infiniminer.sln -c Release --no-build

  e2e:
    name: Play test (Linux, virtual display)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install a virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb xdotool imagemagick
      - name: Build
        run: dotnet build src/Infiniminer.sln -c Release
      - name: Play through the game
        run: tests/e2e/smoke.sh Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: play-test-screenshots
          path: out/e2e/

  package:
    name: Package ${{ matrix.rid }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: ubuntu-latest }
          - { rid: linux-x64, os: ubuntu-latest }
          # macOS packages are built on macOS so the app can be signed.
          - { rid: osx-arm64, os: macos-latest }
          - { rid: osx-x64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install NSIS
        if: startsWith(matrix.rid, 'win-')
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Package
        run: |
          # A v1.2.3 tag names the release; otherwise the protocol version is used.
          version=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; fi
          packaging/package.sh ${{ matrix.rid }} $version
      - uses: actions/upload-artifact@v4
        with:
          name: infiniminer-${{ matrix.rid }}
          path: dist/*

  flatpak:
    name: Flatpak
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install Flatpak
        run: |
          sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder xvfb
          # Ubuntu stops unprivileged user namespaces by default, which Flatpak's sandbox needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build the bundle
        run: |
          version=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; fi
          packaging/flatpak/build.sh $version
      - name: Install it and check the server and game start
        run: |
          flatpak install --user -y --noninteractive dist/*.flatpak
          (sleep 20; echo quit) | timeout 60 flatpak run --command=infiniminer-server io.github.cybermobile.Infiniminer \
              > server.log 2>&1 || true
          cat server.log
          grep -q "SERVER READY" server.log
          timeout 40 xvfb-run -a flatpak run --env=INFINIMINER_TRACE=1 io.github.cybermobile.Infiniminer > client.log 2>&1 || true
          tail -20 client.log
          grep -q "TRACE STATE" client.log
      - uses: actions/upload-artifact@v4
        with:
          name: infiniminer-flatpak
          path: dist/*.flatpak

  docker:
    name: Docker image (${{ matrix.image }})
    needs: test
    strategy:
      matrix:
        image: [server, serverlist]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/infiniminer-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Log in to the GitHub container registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Images are built on every push and published for version tags.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, flatpak, docker, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: infiniminer-*       # the packages, not the play test's screenshots
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
